<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: #0f0f14; color: #ffffff; display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; overflow: hidden; }
        .header { height: 45px; background-color: #0f0f14; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #1c1c24; }
        .logo { font-size: 16px; font-weight: bold; color: #ffffff; }
        .export-btn { background-color: #2f80ed; color: white; border: none; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .preview-window { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #000000; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        .preview-placeholder { text-align: center; color: #8e8e93; font-size: 13px; cursor: pointer; }
        .preview-placeholder span { font-size: 30px; display: block; margin-bottom: 5px; }
        .overlay-text { position: absolute; font-size: 20px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); padding: 5px 10px; display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px dashed #ffffff; pointer-events: none; }
        .timeline-section { height: 90px; background-color: #14141b; border-top: 1px solid #2c2c35; display: flex; flex-direction: column; position: relative; }
        .timeline-tools { height: 30px; display: flex; align-items: center; padding: 0 12px; gap: 15px; border-bottom: 1px solid #2c2c35; }
        .tool-btn { background: none; border: none; color: #cccccc; font-size: 12px; cursor: pointer; }
        .timeline-track { flex: 1; display: flex; align-items: center; justify-content: center; color: #55555e; font-size: 10px; font-family: monospace; }
        .bottom-nav { height: 60px; background-color: #09090d; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1c1c24; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a5a5a5; cursor: pointer; font-size: 10px; background: none; border: none; padding: 2px 0; width: 50px; }
        .nav-icon { font-size: 16px; margin-bottom: 2px; }
        #file-input, #audio-input { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Anas Editor</div>
        <button class="export-btn" onclick="alert('Exporting Video...')">Export</button>
    </div>

    <div class="preview-window">
        <div class="preview-placeholder" id="placeholder" onclick="document.getElementById('file-input').click()">
            <span>➕</span>
            <p>Tap here to load video from phone</p>
        </div>
        <video id="video-player" controls></video>
        <div id="video-text" class="overlay-text">Anas Editor</div>
    </div>

    <input type="file" id="file-input" accept="video/*" onchange="loadVideo(event)">
    <input type="file" id="audio-input" accept="audio/*" onchange="loadAudio(event)">

    <div class="timeline-section">
        <div class="timeline-tools">
            <button class="tool-btn" onclick="alert('Undo')">↩️</button>
            <button class="tool-btn" onclick="alert('Redo')">↪️</button>
            <button class="tool-btn" onclick="alert('Fullscreen')">🔲</button>
        </div>
        <div class="timeline-track" id="track-info">
            00:00 | ----------------------- Video Track -----------------------
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="document.getElementById('file-input').click()">
            <span class="nav-icon">✂️</span>
            <span>Edit</span>
        </button>
        <button class="nav-item" onclick="document.getElementById('audio-input').click()">
            <span class="nav-icon">🎵</span>
            <span>Audio</span>
        </button>
        <button class="nav-item" onclick="addTextOverlay()">
            <span class="nav-icon">Ｔ</span>
            <span>Text</span>
        </button>
        <button class="nav-item" onclick="alert('Stickers Coming Soon')">
            <span class="nav-icon">😊</span>
            <span>Stickers</span>
        </button>
        <button class="nav-item" onclick="alert('Overlay Coming Soon')">
            <span class="nav-icon">🔲</span>
            <span>Overlay</span>
        </button>
        <button class="nav-item" onclick="alert('Effects Coming Soon')">
            <span class="nav-icon">✨</span>
            <span>Effects</span>
        </button>
    </nav>

    <script>
        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoPlayer = document.getElementById('video-player');
                const placeholder = document.getElementById('placeholder');
                const trackInfo = document.getElementById('track-info');
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                trackInfo.innerText = `🎬 ${file.name} | Loaded`;
                videoPlayer.play();
            }
        }

        function addTextOverlay() {
            const userText = prompt("Enter the text you want to add over the video:");
            if (userText) {
                const textDiv = document.getElementById('video-text');
                textDiv.innerText = userText;
                textDiv.style.display = 'block';
            }
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const trackInfo = document.getElementById('track-info');
                trackInfo.innerText = `🎵 Audio added: ${file.name}`;
                alert("Audio Track Mixed Successfully into Anas Editor!");
            }
        }
    </script>
</body>
</html>
