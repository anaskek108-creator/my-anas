<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anas Editor</title>
    <style>
        * { box-sizing: border-box; padding: 0; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0c0c10; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* شريط علوي احترافي */
        .header { height: 50px; background-color: #121218; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #1c1c24; }
        .logo { font-size: 16px; font-weight: bold; letter-spacing: 0.5px; }
        .export-btn { background-color: #2f80ed; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        
        /* نافذة عرض الفيديو الثابتة */
        .preview-window { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #000000; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        .preview-placeholder { text-align: center; color: #8e8e93; font-size: 13px; cursor: pointer; padding: 20px; }
        .preview-placeholder span { font-size: 35px; display: block; margin-bottom: 8px; }
        
        /* طبقة النص المكتوب فوق الفيديو */
        .overlay-text { position: absolute; font-size: 24px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); padding: 5px 10px; display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px dashed rgba(255,255,255,0.4); pointer-events: none; z-index: 10; }
        
        /* منطقة التراك والتايم لاين */
        .timeline-section { height: 110px; background-color: #121218; border-top: 1px solid #22222a; display: flex; flex-direction: column; }
        .timeline-tools { height: 35px; display: flex; align-items: center; padding: 0 12px; gap: 20px; border-bottom: 1px solid #1c1c24; }
        .tool-btn { background: none; border: none; color: #a5a5a5; font-size: 14px; }
        .timeline-track { flex: 1; display: flex; align-items: center; justify-content: center; color: #666670; font-size: 11px; font-family: monospace; background-color: #08080c; }
        
        /* شريط أزرار كاب كات السفلي المثبت بالملي */
        .bottom-nav { height: 70px; background-color: #09090d; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1c1c24; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #a5a5a5; background: none; border: none; font-size: 11px; width: 60px; height: 100%; justify-content: center; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
        
        #file-input, #audio-input { display: none; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header">
        <div class="logo">Anas Editor</div>
        <button class="export-btn" onclick="alert('Exporting Video...')">Export</button>
    </div>

    <!-- شاشة عرض الفيديو والنص -->
    <div class="preview-window">
        <div class="preview-placeholder" id="placeholder" onclick="document.getElementById('file-input').click()">
            <span>➕</span>
            <p>اضغط هنا لرفع فيديو من استوديو هاتفك</p>
        </div>
        <video id="video-player" controls playsinline></video>
        <div id="video-text" class="overlay-text">Anas Editor</div>
    </div>

    <!-- مدخلات الملفات المخفية -->
    <input type="file" id="file-input" accept="video/*" onchange="loadVideo(event)">
    <input type="file" id="audio-input" accept="audio/*" onchange="loadAudio(event)">

    <!-- التايم لاين -->
    <div class="timeline-section">
        <div class="timeline-tools">
            <button class="tool-btn" onclick="alert('Undo')">↩️</button>
            <button class="tool-btn" onclick="alert('Redo')">↪️</button>
            <button class="tool-btn" onclick="alert('Fullscreen')">🔲</button>
        </div>
        <div class="timeline-track" id="track-info">
            00:00 | ----------------------- Video Track -----------------------
        </div>
    </div>

    <!-- شريط الأدوات السفلي المثبت -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="document.getElementById('file-input').click()">
            <span class="nav-icon">✂️</span>
            <span>تعديل</span>
        </button>
        <button class="nav-item" onclick="document.getElementById('audio-input').click()">
            <span class="nav-icon">🎵</span>
            <span>صوت</span>
        </button>
        <button class="nav-item" onclick="addTextOverlay()">
            <span class="nav-icon">Ｔ</span>
            <span>نص</span>
        </button>
        <button class="nav-item" onclick="alert('الملصقات قريباً')">
            <span class="nav-icon">😊</span>
            <span>ملصقات</span>
        </button>
        <button class="nav-item" onclick="alert('مؤثرات قريباً')">
            <span class="nav-icon">✨</span>
            <span>مؤثرات</span>
        </button>
    </nav>

    <script>
        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoPlayer = document.getElementById('video-player');
                const placeholder = document.getElementById('placeholder');
                const trackInfo = document.getElementById('track-info');
                
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.style.display = 'block';
                placeholder.style.display = 'none';
                trackInfo.innerText = `🎬 ${file.name} | جاهز للتعديل`;
                videoPlayer.play();
            }
        }

        function addTextOverlay() {
            const userText = prompt("اكتب النص الذي تريده فوق الفيديو:");
            if (userText) {
                const textDiv = document.getElementById('video-text');
                textDiv.innerText = userText;
                textDiv.style.display = 'block';
            }
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const trackInfo = document.getElementById('track-info');
                trackInfo.innerText = `🎵 تم دمج الصوت: ${file.name}`;
                alert("تم إضافة المسار الصوتي بنجاح داخل Anas Editor!");
            }
        }
    </script>
</body>
</html>
